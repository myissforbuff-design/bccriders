    <script>
      // Make window.fetch assignable (writable via getter/setter) to prevent getter-only TypeError when polyfills reassign fetch
      (function() {
        if (typeof window !== 'undefined' && window.fetch) {
          try {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            try {
              if (window.Window && window.Window.prototype) {
                var currentFetchProto = window.fetch;
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() { return currentFetchProto; },
                  set: function(fn) { currentFetchProto = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (err) {}
          }
        }
      })();
    </script>
